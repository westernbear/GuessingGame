services:
  kbot:
    image: ghcr.io/westernbear/guessinggame:latest
    build: .
    restart: unless-stopped
    env_file: .env
    # 터널/리버스 프록시만 붙도록 로컬에만 연다
    ports:
      - "127.0.0.1:${KBOT_PORT:-8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # docker compose --profile tunnel up -d 로 Cloudflare Tunnel까지 띄운다
  # (Zero Trust에서 public hostname kbot.westernbear.dev -> http://kbot:8080 지정)
  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [kbot]
